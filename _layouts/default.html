<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>
  <body class="{{ page.body_class | default: '' }}">
    <a class="skip-link" href="#main">Skip to content</a>

      {{ content }}
    </main>
    {% include site-footer.html %}

  </body>
</html>
