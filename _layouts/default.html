<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    {% include head.html %}
    <link rel="stylesheet" href="{{ '/assets/css/ks-badge.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/ks-badge-overrides.css' | relative_url }}">
  </head>
  <body class="{{ page.body_class | default: '' }}">
    <a class="skip-link" href="#main">Skip to content</a>
    {% include site-header.html %}
    <main id="main">
      {{ content }}
    </main>
    {% include site-footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/ks-badge.js' | relative_url }}" defer></script>
  </body>
</html>
